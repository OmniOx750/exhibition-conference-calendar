name: One-time ROI V6 install

on:
  push:
    paths:
      - '.github/workflows/one-time-roi-v6-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load ROI V6 on Exhibition Performance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="roi-upgrade-v6.js?v=20260908"></script>'
          if tag in s:
              print('Already installed')
          elif '</body>' in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
              print('Installed')
          else:
              raise SystemExit('Missing </body>')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply ROI template performance upgrade'
          git push origin HEAD:main
