name: One-time exhibition visual upgrade

on:
  push:
    paths:
      - '.github/workflows/one-time-apply-exhibition-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Link unified theme and ROI upgrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          theme = '  <link rel="stylesheet" href="mekics-glass-theme.css" />\n'
          roi = '  <script src="roi-upgrade-v6.js"></script>\n'

          if 'mekics-glass-theme.css' not in s:
              if '</head>' not in s:
                  raise SystemExit('No </head> found')
              s = s.replace('</head>', theme + '</head>', 1)

          if 'roi-upgrade-v6.js' not in s:
              if '</body>' not in s:
                  raise SystemExit('No </body> found')
              s = s.replace('</body>', roi + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/one-time-apply-exhibition-theme.yml

      - name: Commit visual upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-apply-exhibition-theme.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Apply unified glass theme to exhibition app'
          git push origin HEAD:main
