name: One-time dashboard collapse install

on:
  push:
    paths:
      - '.github/workflows/one-time-dashboard-collapse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Link dashboard collapse script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='  <script src="dashboard-collapse.js?v=20260908"></script>\n'
          if 'dashboard-collapse.js' not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-dashboard-collapse.yml
      - name: Commit install
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-dashboard-collapse.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable collapsible dashboard panels'
          git push origin HEAD:main
